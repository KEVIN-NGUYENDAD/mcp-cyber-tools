services:
  - type: web
    name: sentinelops
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATE_DIR
        value: ./state
      - key: PORT
        value: 3000
    autoDeploy: git
    branch: docs-sync
    routes:
      - path: /
        matchType: all
