services:
  - type: web
    name: sentinelops-soc
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node web-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: git
    branch: main
    routes:
      - path: /
        matchType: all
      - path: /latest
        matchType: all
      - path: /brief
        matchType: path
      - path: /api
        matchType: path
      - path: /health
        matchType: all
